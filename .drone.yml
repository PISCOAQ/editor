kind: pipeline
type: docker
name: Node-Editor

globals:
  - &docker_creds
    username:
      from_secret: docker_username
    password:
      from_secret: docker_password
  - &env
    AUTH0_SECRET: secret #NOTE: AUTHO parameters are just a setup for later use, we didn't integrate auth0 yet, right now it's without login
    AUTH0_ISSUER_BASE_URL: url
    AUTH0_CLIENT_ID: client_id
    AUTH0_CLIENT_SECRET: client_secret
    AUTH0_AUDIENCE: https://api.polyglot-edu.com
    AUTH0_SCOPE: 'openid profile email read:products'
    DEPLOY_URL: #TODO: add your deployment url here
    BACK_URL: #TODO: add your backend url here
    TEST_MODE: true
  - &condition
    event:
      - push

steps:
  - name: Build and push image to Docker # building the encore docker image
    image: plugins/docker
    settings:
      repo: # TODO: insert your repository name (must be lowercase, ex: docker.polyglot-edu.com/polyglot-edu/node-editor)
      registry: #TODO: insert your registry url (ex: docker.polyglot-edu.com)
      dockerfile: ./Dockerfile
      tags: ['${DRONE_BRANCH}']
      build_args:
        - 'DEPLOY_URL=...' #TODO: add your deployment url here
        - 'BACK_URL=https://...' #TODO: add your backend url here
        - 'TEST_MODE=true'
      <<: *docker_creds
    when:
      <<: *condition
  - name: Deploy Production # deploy to kubernetes using a Helm chart
    image: pelotech/drone-helm3
    environment:
      CFORIGIN:
        from_secret: cf_origin
      DOCKERCONFIG:
        from_secret: dockerconfigjson
      <<: *env
    settings:
      mode: upgrade
      chart: ./charts
      release: editor-${DRONE_BRANCH}
      namespace: editor-${DRONE_BRANCH}
      debug: true
      kube_service_account: admin-user
      kube_api_server: 'https://...' #TODO: add your kubernetes api server here
      kube_token:
        from_secret: kube_token
      values:
        - 'url=...' #TODO: add your deployment url here
        - 'cfOriginKey=$CFORIGIN'
        - 'dockerconfigjson=$DOCKERCONFIG'
        - 'image.repository=...' #TODO: add your image repository here (ex: docker.polyglot-edu.com/polyglot-edu/node-editor)
        - 'image.tag=${DRONE_BRANCH}'
        - 'env.authSecret=$AUTH0_SECRET'
        - 'env.authIssuerUrl=$AUTH0_ISSUER_BASE_URL'
        - 'env.authClientId=$AUTH0_CLIENT_ID'
        - 'env.authClientSecret=$AUTH0_CLIENT_SECRET'
        - 'env.authAudience=$AUTH0_AUDIENCE'
        - 'env.authScope=$AUTH0_SCOPE'
        - 'env.backUrl=$BACK_URL'
        - 'env.testMode=$TEST_MODE'
      cleanup_failed_upgrade: true
      force_upgrade: true
      skip_tls_verify: true
      create_namespace: true
    depends_on:
      - Build and push image to Docker
    when:
      <<: *condition
      branch:
        include:
          - main
  - name: Deploy Development # deploy to kubernetes using a Helm chart
    image: pelotech/drone-helm3
    environment:
      CFORIGIN:
        from_secret: cf_origin
      DOCKERCONFIG:
        from_secret: dockerconfigjson
      <<: *env
    settings:
      mode: upgrade
      chart: ./charts
      release: node-editor-${DRONE_BRANCH}
      namespace: node-editor-${DRONE_BRANCH}
      debug: true
      kube_service_account: admin-user
      kube_api_server: 'https://...' #TODO: add your kubernetes api server here
      kube_token:
        from_secret: kube_token
      values:
        - 'url=${DRONE_BRANCH}-dashboard.polyglot-edu.com'
        - 'cfOriginKey=$CFORIGIN'
        - 'dockerconfigjson=$DOCKERCONFIG'
        - 'image.repository=...' #TODO: add your image repository here (ex: docker.polyglot-edu.com/polyglot-edu/node-editor)
        - 'image.tag=${DRONE_BRANCH}'
        - 'env.authSecret=$AUTH0_SECRET'
        - 'env.authIssuerUrl=$AUTH0_ISSUER_BASE_URL'
        - 'env.authClientId=$AUTH0_CLIENT_ID'
        - 'env.authClientSecret=$AUTH0_CLIENT_SECRET'
        - 'env.authAudience=$AUTH0_AUDIENCE'
        - 'env.authScope=$AUTH0_SCOPE'
        - 'env.backUrl=$BACK_URL'
        - 'env.testMode=$TEST_MODE'
      cleanup_failed_upgrade: true
      force_upgrade: true
      skip_tls_verify: true
      create_namespace: true
    depends_on:
      - Build and push image to Docker
    when:
      <<: *condition
      branch:
        exclude:
          - main
